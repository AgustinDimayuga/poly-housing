[project]
name = "poly-housing-api"
version = "0.1.0"
description = "FastAPI backend for Poly Housing"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.4",
    "pwdlib[argon2]>=0.2",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint.per-file-ignores]
# Generated from alembic/script.py.mako
"alembic/versions/*" = ["UP007", "UP035", "I001"]
